<div id="health-daily" aria-label="건강관리 Windows UI 시안">
  <div class="hd-titlebar"><span><i data-lucide="heart-pulse" aria-hidden="true"></i> 건강노트</span><span>Windows · UI Preview</span><span class="hd-window" aria-hidden="true">−　□　×</span></div>
  <div class="hd-shell">
    <aside class="hd-sidebar">
      <div class="hd-brand"><span class="hd-mark"><i data-lucide="heart-pulse" aria-hidden="true"></i></span><div>건강노트<small>내 일상의 건강 기록</small></div></div>
      <nav aria-label="주 메뉴">
        <button data-page="home"><i data-lucide="house" aria-hidden="true"></i> 오늘의 건강</button>
        <button data-page="med"><i data-lucide="pill" aria-hidden="true"></i> 복약관리</button>
        <button data-page="body"><i data-lucide="chart-no-axes-combined" aria-hidden="true"></i> 바디리포트</button>
        <button data-page="symptom"><i data-lucide="clipboard-list" aria-hidden="true"></i> 증상기록</button>
      </nav>
      <div class="hd-side-bottom"><span class="hd-avatar">나</span><div>나의 건강 기록<small>합성 데이터 · 개인용 시안</small></div></div>
    </aside>
    <main class="hd-main">
      <header class="hd-header"><div><div class="hd-eyebrow">MY DAILY HEALTH</div><h1 id="hd-heading">오늘의 건강</h1><p id="hd-subtitle">작은 기록으로, 오늘도 나를 돌봐요.</p></div><div class="hd-date"><i data-lucide="calendar-days" aria-hidden="true"></i> 2026. 9. 30. 수요일</div></header>
      <div id="hd-content"></div>
      <div id="hd-live" class="hd-feedback" aria-live="polite"></div>
    </main>
  </div>
  <section class="hd-review" aria-label="시안 상태 검토"><span>상태 검토</span><button data-scenario="normal">정상</button><button data-scenario="empty">등록 없음</button><button data-scenario="error">저장 실패</button><span>로컬 동작 · 실제 연동 없음</span></section>
  <div id="hd-overlay" hidden></div>
</div>
<style>
#health-daily{--hd-bg:light-dark(#f4f6f5,#151b19);--hd-surface:light-dark(#fff,#202824);--hd-ink:light-dark(#20342c,#e8eeeb);--hd-muted:light-dark(#64776e,#adbbb3);--hd-line:light-dark(#dfe7e2,#3b4841);--hd-green:light-dark(#087c51,#69d6a5);--hd-on:light-dark(#fff,#123729);--hd-soft:light-dark(#e9f5ef,#263e32);--hd-warn:light-dark(#9d422e,#ffc4b3);--hd-warnbg:light-dark(#fff0eb,#493028);--hd-radius:16px;color:var(--hd-ink);font:14px/1.6 'Segoe UI','Malgun Gothic',sans-serif;background:var(--hd-bg);border:1px solid var(--hd-line);border-radius:12px;overflow:hidden;position:relative}
#health-daily *{box-sizing:border-box}#health-daily [hidden]{display:none!important}#health-daily button,#health-daily input,#health-daily select{font:inherit}#health-daily button{color:inherit;cursor:inherit}#health-daily button:disabled{opacity:.55}#health-daily button{min-height:38px}#health-daily h1,#health-daily h2,#health-daily h3,#health-daily p{margin:0}#health-daily h1{font-size:27px;font-weight:650;letter-spacing:-1px}#health-daily h2{font-size:18px;font-weight:650;letter-spacing:-.5px}#health-daily h3{font-size:15px;font-weight:600}#health-daily small{display:block;font-size:12px;color:var(--hd-muted)}#health-daily svg{width:18px;height:18px;flex-shrink:0}
#health-daily .hd-titlebar{display:flex;align-items:center;justify-content:space-between;padding:9px 18px;background:var(--hd-surface);border-bottom:1px solid var(--hd-line);font-size:11px;color:var(--hd-muted)}#health-daily .hd-titlebar span:first-child{display:flex;gap:8px;align-items:center;color:var(--hd-ink)}#health-daily .hd-window{letter-spacing:3px}
#health-daily .hd-shell{display:grid;grid-template-columns:190px minmax(0,1fr)}#health-daily .hd-sidebar{background:var(--hd-surface);padding:28px 16px 20px;display:flex;flex-direction:column;border-right:1px solid var(--hd-line)}#health-daily .hd-brand{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:650;padding:0 4px 30px}#health-daily .hd-brand small{font-weight:400;font-size:11px}#health-daily .hd-mark{display:grid;place-items:center;background:var(--hd-soft);color:var(--hd-green);width:36px;height:36px;border-radius:12px}
#health-daily nav{display:grid;gap:7px}#health-daily nav button{display:flex;align-items:center;gap:11px;border:0;background:transparent;padding:12px;border-radius:9px;text-align:left;color:var(--hd-muted)}#health-daily nav button[aria-current=page]{background:var(--hd-soft);color:var(--hd-green);font-weight:650}#health-daily .hd-side-bottom{margin-top:auto;padding-top:130px;display:flex;align-items:center;gap:9px;font-size:12px}#health-daily .hd-side-bottom small{font-size:10px}#health-daily .hd-avatar{border-radius:50%;background:var(--hd-bg);width:30px;height:30px;display:grid;place-items:center}
#health-daily .hd-main{padding:30px 28px 20px;min-width:0}#health-daily .hd-header{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:26px}#health-daily .hd-eyebrow{font-size:10px;letter-spacing:2px;font-weight:650;color:var(--hd-green);margin-bottom:5px}#health-daily .hd-header p{font-size:13px;color:var(--hd-muted);margin-top:5px}#health-daily .hd-date{display:flex;align-items:center;gap:7px;white-space:nowrap;font-size:11px;color:var(--hd-muted)}
#health-daily .hd-card{background:var(--hd-surface);border:1px solid var(--hd-line);border-radius:var(--hd-radius);padding:21px;min-width:0}#health-daily .hd-cardhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}#health-daily .hd-cardhead small{margin-top:3px}#health-daily .hd-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px}#health-daily .hd-stack{display:grid;gap:16px;align-content:start}#health-daily .hd-btn{border:1px solid var(--hd-line);border-radius:8px;background:var(--hd-surface);padding:8px 13px;display:inline-flex;gap:7px;align-items:center;justify-content:center;white-space:nowrap}#health-daily .hd-primary{background:var(--hd-green);border-color:var(--hd-green);color:var(--hd-on)}#health-daily .hd-link{border:0;background:transparent;color:var(--hd-green);padding:3px 0;font-size:12px;display:inline-flex;gap:4px;align-items:center}#health-daily .hd-tag{background:var(--hd-soft);color:var(--hd-green);border-radius:6px;padding:4px 8px;font-size:11px;white-space:nowrap}#health-daily .hd-warn{background:var(--hd-warnbg);color:var(--hd-warn);padding:12px 14px;border-radius:8px;margin:12px 0;font-size:12px}
#health-daily .hd-dose{display:grid;grid-template-columns:45px minmax(0,1fr) auto;gap:10px;align-items:center;padding:17px 0;border-top:1px solid var(--hd-line)}#health-daily .hd-time{font-size:12px;color:var(--hd-muted);font-variant-numeric:tabular-nums}#health-daily .hd-medname{border:0;padding:0;background:transparent;text-align:left;font-size:14px;white-space:normal;overflow-wrap:anywhere}#health-daily .hd-dose .hd-check{border:1px solid var(--hd-line);border-radius:8px;background:var(--hd-surface);padding:6px 10px;font-size:12px}#health-daily .hd-dose .hd-check[aria-pressed=true]{background:var(--hd-soft);color:var(--hd-green);border-color:var(--hd-soft)}#health-daily .hd-dose .hd-check:disabled{color:var(--hd-muted)}#health-daily .hd-progress{height:5px;background:var(--hd-bg);border-radius:8px;margin:13px 0 5px;overflow:hidden}#health-daily .hd-progress span{display:block;height:100%;background:var(--hd-green)}#health-daily .hd-summary{display:flex;justify-content:space-between;color:var(--hd-muted);font-size:12px}
#health-daily .hd-connect{padding:19px;border-radius:10px;background:var(--hd-soft);margin-bottom:16px}#health-daily .hd-connect p{font-size:12px;color:var(--hd-muted);margin-top:7px}#health-daily .hd-bodyvalues{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}#health-daily .hd-value{font-size:23px;font-weight:600;font-variant-numeric:tabular-nums}#health-daily .hd-value span{font-size:12px;font-weight:400;color:var(--hd-muted)}#health-daily .hd-empty{text-align:center;padding:34px 8px}#health-daily .hd-empty p{color:var(--hd-muted);font-size:12px;margin:8px 0 18px}#health-daily .hd-empty svg{width:30px;height:30px;color:var(--hd-green);margin-bottom:12px}
#health-daily .hd-medlayout{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(220px,1fr);gap:16px}#health-daily .hd-toolbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:16px}#health-daily .hd-days{display:flex;gap:5px;align-items:center}#health-daily .hd-days button{min-width:35px;padding:5px 9px}#health-daily .hd-detail-icon{width:44px;height:44px;background:var(--hd-soft);border-radius:14px;display:grid;place-items:center;color:var(--hd-green);margin-bottom:16px}#health-daily dl{margin:20px 0}#health-daily dl div{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-top:1px solid var(--hd-line);font-size:12px}#health-daily dt{color:var(--hd-muted)}#health-daily dd{margin:0;text-align:right}#health-daily .hd-footnote{font-size:11px;color:var(--hd-muted);margin-top:14px}#health-daily .hd-feedback{font-size:12px;color:var(--hd-green);min-height:22px;margin-top:14px}
#health-daily .hd-review{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 18px;border-top:1px solid var(--hd-line);background:var(--hd-surface);font-size:11px;color:var(--hd-muted)}#health-daily .hd-review button{border:1px solid var(--hd-line);background:var(--hd-bg);border-radius:6px;min-height:30px;padding:3px 9px;font-size:11px}#health-daily .hd-review span:last-child{margin-left:auto}#health-daily .hd-review button[aria-pressed=true]{color:var(--hd-green);background:var(--hd-soft)}
#health-daily #hd-overlay{position:absolute;inset:0;background:light-dark(#20342c55,#0008);z-index:5;display:flex;align-items:flex-start;justify-content:center;padding:65px 18px 20px;overflow:auto}#health-daily .hd-dialog{width:470px;max-width:100%;background:var(--hd-surface);border:1px solid var(--hd-line);border-radius:18px;padding:25px;box-shadow:0 12px 40px light-dark(#20342c22,#0006)}#health-daily .hd-dialoghead{display:flex;align-items:center;justify-content:space-between;margin-bottom:17px}#health-daily .hd-dialoghead button{border:0;background:transparent;padding:4px 8px}#health-daily .hd-steps{display:flex;gap:14px;font-size:11px;color:var(--hd-muted);margin-bottom:20px}#health-daily .hd-steps .active{color:var(--hd-green);font-weight:600}#health-daily .hd-field{display:block;margin:14px 0;font-size:12px}#health-daily .hd-field input,#health-daily .hd-field select{display:block;width:100%;border:1px solid var(--hd-line);background:var(--hd-bg);color:var(--hd-ink);border-radius:8px;padding:10px;margin-top:6px;min-width:0}#health-daily .hd-formrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}#health-daily .hd-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:23px}#health-daily .hd-note{font-size:12px;color:var(--hd-muted)}#health-daily .hd-radio{display:flex;gap:8px;align-items:center;margin:14px 0;font-size:12px}#health-daily .hd-result{border:1px solid var(--hd-line);background:var(--hd-bg);border-radius:9px;padding:12px;margin-top:10px;width:100%;text-align:left}
@media(max-width:850px){#health-daily .hd-shell{grid-template-columns:150px minmax(0,1fr)}#health-daily .hd-main{padding:22px 18px}#health-daily .hd-header{align-items:flex-start;flex-direction:column}#health-daily .hd-grid,#health-daily .hd-medlayout{grid-template-columns:1fr}#health-daily .hd-side-bottom{padding-top:60px}#health-daily .hd-brand{font-size:16px;gap:7px}#health-daily .hd-brand small{display:none}}
@media(max-width:520px){#health-daily .hd-shell{display:block}#health-daily .hd-sidebar{padding:12px;border-right:0;border-bottom:1px solid var(--hd-line)}#health-daily .hd-brand,#health-daily .hd-side-bottom{display:none}#health-daily nav{grid-template-columns:1fr 1fr;gap:4px}#health-daily nav button{padding:8px;font-size:12px}#health-daily .hd-main{padding:20px 12px}#health-daily .hd-titlebar span:nth-child(2){display:none}#health-daily .hd-card{padding:16px}#health-daily .hd-dose{grid-template-columns:38px minmax(0,1fr);gap:7px}#health-daily .hd-check{grid-column:2;justify-self:start}#health-daily .hd-dialog{padding:18px}#health-daily #hd-overlay{padding-top:25px}#health-daily .hd-review span:last-child{margin-left:0;flex-basis:100%}#health-daily .hd-formrow{grid-template-columns:1fr}#health-daily input,#health-daily select{font-size:16px!important}}
</style>
<script>
(()=>{
const root=document.getElementById('health-daily'), content=root.querySelector('#hd-content'),overlay=root.querySelector('#hd-overlay'),live=root.querySelector('#hd-live');
const initial=[{id:1,name:'비타민 D · 예시',kind:'영양제',time:'08:00',note:'사용자 메모 · 아침 식사 후',done:true,ended:false},{id:2,name:'등록한 약 A · 예시',kind:'약',time:'13:00',note:'사용자가 입력한 일정',done:false,ended:false},{id:3,name:'마그네슘 · 예시',kind:'영양제',time:'20:00',note:'사용자 메모 · 저녁 식사 후',done:false,ended:false}];
let state={page:'home',scenario:'normal',items:initial.map(x=>({...x})),selected:2,day:0,connected:false},draft={name:'',kind:'영양제',time:'08:00',start:'2026-09-30',end:'',note:'',notify:true,method:'direct'},step=1,returnFocus=null;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function restore(saved){const p=saved?.privateContent;if(p&&Array.isArray(p.items)&&p.items.length<30){state={...state,...p};if(!['home','med','body','symptom'].includes(state.page))state.page='home';}}
restore(window.openai?.widgetState);
function persist(){window.openai?.setWidgetState({modelContent:{screen:state.page,scenario:state.scenario,checked:state.items.filter(x=>x.done).length},privateContent:state})?.catch(()=>{});}
function icons(){if(globalThis.lucide)lucide.createIcons({attrs:{width:18,height:18}});root.querySelectorAll('button').forEach(b=>b.classList.add('cursor-interaction'));}
function active(){return state.items.filter(x=>!x.ended&&(!x.start||x.start<='2026-09-30')&&(!x.end||x.end>='2026-09-30'));}function dated(){return state.day===0?active():[];}
function doses(list){return list.map(x=>`<div class="hd-dose"><span class="hd-time">${esc(x.time)}</span><div><button class="hd-medname" data-select="${x.id}">${esc(x.name)}</button><small>${esc(x.note||x.kind)}</small></div><button class="hd-check" data-check="${x.id}" aria-pressed="${x.done}" aria-label="${esc(x.name)} ${x.done?'복용 체크 취소':'복용 체크'}">${x.done?'✓ 복용 완료':'복용 체크'}</button></div>`).join('');}
function empty(){return `<div class="hd-empty"><i data-lucide="pill" aria-hidden="true"></i><h3>${state.items.length?'이 날짜에 예정된 복약이 없어요':'복약 기록을 시작해 보세요'}</h3><p>${state.items.length?'다른 날짜를 선택해 일정을 확인하세요.':'복용 중인 약이나 영양제를 등록해 주세요.'}</p><button class="hd-btn hd-primary" data-add>약 등록하기</button></div>`;}
function medcard(){const a=active(),n=a.filter(x=>x.done).length;return `<section class="hd-card"><div class="hd-cardhead"><div><h2>오늘의 복약</h2><small>등록한 일정에 맞춰 기록하세요</small></div><span class="hd-tag">${n} / ${a.length} 완료</span></div><div class="hd-progress"><span style="width:${a.length?n/a.length*100:0}%"></span></div><div class="hd-summary"><span>복용 기록</span><span>${a.length-n}건 남음</span></div>${a.length?doses(a):empty()}<button class="hd-link" data-go="med">복약관리 전체 보기 <i data-lucide="arrow-right" aria-hidden="true"></i></button></section>`;}
function bodycard(){return `<section class="hd-card"><div class="hd-cardhead"><h2>바디리포트</h2><i data-lucide="activity" aria-hidden="true"></i></div>${state.connected?`<small>최근 측정 · 2026. 9. 28. · 합성 데이터</small><div class="hd-bodyvalues"><div><small>체중</small><div class="hd-value">68.2 <span>kg</span></div></div><div><small>체지방률</small><div class="hd-value">21.4 <span>%</span></div></div></div><p class="hd-footnote">데이터 조회 시안 · 건강 판정 없음</p>`:`<div class="hd-connect"><h3>체성분 기록을 한눈에</h3><p>측정 데이터를 연결하면<br>날짜별 변화를 확인할 수 있어요.</p></div>`}<button class="hd-link" data-go="body">${state.connected?'측정 기록 보기':'연동 상태 확인'} <i data-lucide="arrow-right" aria-hidden="true"></i></button></section>`;}
function render(){root.querySelectorAll('[data-page]').forEach(b=>{if(b.dataset.page===state.page)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});root.querySelectorAll('[data-scenario]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.scenario===state.scenario));const titles={home:['오늘의 건강','작은 기록으로, 오늘도 나를 돌봐요.'],med:['복약관리','내가 등록한 일정과 복용 기록을 확인하세요.'],body:['바디리포트','측정 기록의 연결 상태와 날짜별 수치'],symptom:['증상기록','몸의 변화를 기록하고 다시 확인하세요.']};root.querySelector('#hd-heading').textContent=titles[state.page][0];root.querySelector('#hd-subtitle').textContent=titles[state.page][1];
if(state.page==='home')content.innerHTML=`<div class="hd-grid">${medcard()}<div class="hd-stack">${bodycard()}<section class="hd-card"><div class="hd-cardhead"><h2>증상기록</h2><i data-lucide="clipboard-list" aria-hidden="true"></i></div><p class="hd-note">최근 기록이 없어요.<br>느꼈던 증상을 기록으로 남겨보세요.</p><button class="hd-link" data-go="symptom">증상기록 열기 <i data-lucide="arrow-right" aria-hidden="true"></i></button></section></div></div>`;
if(state.page==='med'){let x=state.items.find(x=>x.id===state.selected);content.innerHTML=`<div class="hd-toolbar"><div class="hd-days"><button class="hd-btn" data-day="-1" aria-label="이전 날짜">‹</button><span>9월 ${30+state.day}일</span><button class="hd-btn" data-day="1" aria-label="다음 날짜" ${state.day===0?'disabled':''}>›</button><button class="hd-link" data-today>오늘</button></div><button class="hd-btn hd-primary" data-add><i data-lucide="plus" aria-hidden="true"></i> 약 추가</button></div><div class="hd-medlayout"><section class="hd-card"><div class="hd-cardhead"><h2>복용 일정</h2><small>대한민국 시간</small></div>${state.scenario==='error'?'<div class="hd-warn">저장 실패 상황입니다. 복용 체크 후 복구 동작을 확인하세요.</div>':''}${dated().length?doses(dated()):empty()}</section><section class="hd-card">${x?`<div class="hd-detail-icon"><i data-lucide="pill" aria-hidden="true"></i></div><span class="hd-tag">${esc(x.kind)} · ${x.ended?'관리 종료':'관리 중'}</span><h2 style="margin-top:12px;overflow-wrap:anywhere">${esc(x.name)}</h2><dl><div><dt>복용 일정</dt><dd>매일 ${esc(x.time)}</dd></div><div><dt>관리 기간</dt><dd>${x.start||'2026-09-30'}<br>${x.end||'종료일 없음'}</dd></div><div><dt>알림 설정</dt><dd>${x.notify===false?'꺼짐':'켜짐'} · 발송 없음</dd></div><div><dt>등록 방식</dt><dd>${x.method==='search'?'합성 카탈로그':'직접 입력'}</dd></div></dl><h3>내 메모</h3><p class="hd-note" style="margin-top:8px">${esc(x.note||'입력한 메모가 없어요.')}</p><p class="hd-footnote">직접 등록한 항목에는 검증된 약 정보가 제공되지 않습니다.</p>${!x.ended?`<button class="hd-btn" data-end="${x.id}" style="margin-top:20px">일정 관리 종료</button>`:'<p class="hd-footnote">기존 기록은 유지됩니다. 다시 관리하려면 새로 등록해 주세요.</p>'}`:'<h3>약을 선택해 주세요</h3><p class="hd-note">등록 정보와 일정을 여기에서 확인할 수 있어요.</p>'}</section></div>`;}
if(state.page==='body')content.innerHTML=`<section class="hd-card"><div class="hd-cardhead"><div><h2>${state.connected?'연결된 측정 기록':'측정 데이터 연결'}</h2><small>연동 시뮬레이터</small></div><span class="hd-tag">${state.connected?'시뮬레이션 연결됨':'연결 전'}</span></div>${state.connected?'<div class="hd-bodyvalues"><div><small>체중 · 9월 28일</small><div class="hd-value">68.2 <span>kg</span></div></div><div><small>체지방률 · 9월 28일</small><div class="hd-value">21.4 <span>%</span></div></div></div><p class="hd-footnote">합성 측정 데이터입니다. 실제 인바디 인증·수신은 수행하지 않습니다.</p>':'<div class="hd-connect"><h3>나의 체성분 기록을 연결해 보세요</h3><p>이 시안에서는 계정 정보 입력 없이 연결 상태만 검토합니다.</p></div>'}<button class="hd-btn ${state.connected?'':'hd-primary'}" data-connect style="margin-top:18px">${state.connected?'시뮬레이션 연결 해제':'시뮬레이션 연결'}</button></section>`;
if(state.page==='symptom')content.innerHTML='<section class="hd-card"><div class="hd-empty"><i data-lucide="clipboard-list" aria-hidden="true"></i><h3>아직 남긴 증상 기록이 없어요</h3><p>증상 질문·결과 화면은 후속 설계 범위입니다.</p></div></section>';
icons();}
function say(s,error=false){live.textContent=s;live.style.color=error?'var(--hd-warn)':'var(--hd-green)';}
function close(){root.querySelector('.hd-shell').inert=false;root.querySelector('.hd-review').inert=false;overlay.hidden=true;overlay.innerHTML='';returnFocus?.focus();}
function open(html,label){returnFocus=document.activeElement;overlay.innerHTML=`<section class="hd-dialog" role="dialog" aria-modal="true" aria-label="${label}">${html}</section>`;overlay.hidden=false;root.querySelector('.hd-shell').inert=true;root.querySelector('.hd-review').inert=true;icons();overlay.querySelector('input,button')?.focus();}
function dialog(){const steps=`<div class="hd-dialoghead"><h2>약 등록</h2><button data-close aria-label="등록 닫기">×</button></div><div class="hd-steps"><span class="${step===1?'active':''}">약 정보</span><span class="${step===2?'active':''}">복용 일정</span><span class="${step===3?'active':''}">확인</span></div>`;
let html=step===1?`<label class="hd-field">등록 방식<select id="hd-method"><option value="direct" ${draft.method==='direct'?'selected':''}>직접 등록</option><option value="search" ${draft.method==='search'?'selected':''}>예시 카탈로그 검색</option></select></label><label class="hd-field">약 또는 영양제 이름<input id="hd-name" maxlength="80" value="${esc(draft.name)}" placeholder="이름을 입력해 주세요" required></label>${draft.method==='search'?'<button class="hd-result" data-result>비타민 C · 합성 카탈로그 예시</button>':''}<label class="hd-field">종류<select id="hd-kind"><option ${draft.kind==='영양제'?'selected':''}>영양제</option><option ${draft.kind==='약'?'selected':''}>약</option></select></label><p class="hd-note">직접 등록은 이름과 일정을 관리합니다.<br>약 정보·복용 방법을 자동 추천하지 않습니다.</p>`:step===2?`<div class="hd-formrow"><label class="hd-field">시작일<input id="hd-start" type="date" value="${draft.start}" required></label><label class="hd-field">종료일 · 선택<input id="hd-end" type="date" value="${draft.end}"></label></div><label class="hd-field">매일 복용 시각<input id="hd-time" type="time" value="${draft.time}" required></label><label class="hd-field">내 메모 · 선택<input id="hd-note" maxlength="100" value="${esc(draft.note)}" placeholder="일정에 함께 표시할 메모"></label><label class="hd-radio"><input id="hd-notify" type="checkbox" ${draft.notify?'checked':''}> 알림 켜기</label><p class="hd-note">시간대: 대한민국 · 알림은 이 시안에서 발송되지 않습니다.</p>`:`<div class="hd-connect"><h3>${esc(draft.name)}</h3><p>${esc(draft.kind)} · 매일 ${draft.time}<br>${draft.start}부터 ${draft.end?' '+draft.end+'까지':'종료일 없이'}<br>알림 ${draft.notify?'켜짐':'꺼짐'} · 시안에서는 발송 없음</p></div><p class="hd-note">저장하면 복약관리에서 일정을 확인할 수 있어요.</p>`;
overlay.innerHTML=`<section class="hd-dialog" role="dialog" aria-modal="true" aria-label="약 등록">${steps}<form id="hd-form">${html}<div id="hd-formerror" role="alert"></div><div class="hd-actions">${step>1?'<button type="button" class="hd-btn" data-prev>이전</button>':''}<button class="hd-btn hd-primary" type="button" data-next>${step===3?'등록하기':'다음'}</button></div></form></section>`;overlay.hidden=false;root.querySelector('.hd-shell').inert=true;root.querySelector('.hd-review').inert=true;icons();overlay.querySelector('input,select,button')?.focus();}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
if(b.dataset.page||b.dataset.go){state.page=b.dataset.page||b.dataset.go;say('');render();persist();}
if(b.hasAttribute('data-add')){returnFocus=b;draft={name:'',kind:'영양제',time:'08:00',start:'2026-09-30',end:'',note:'',notify:true,method:'direct'};step=1;dialog();}
if(b.dataset.retrycheck){const x=state.items.find(x=>x.id===+b.dataset.retrycheck);state.scenario='normal';x.done=!x.done;render();say('다시 시도해 복용 기록을 저장했어요.');persist();}if(b.hasAttribute('data-retryreg')){state.scenario='normal';root.querySelector('[data-scenario=error]').setAttribute('aria-pressed','false');root.querySelector('[data-scenario=normal]').setAttribute('aria-pressed','true');overlay.querySelector('#hd-formerror').textContent='다시 등록하기를 눌러 주세요. 입력 내용은 유지됩니다.';}if(b.dataset.select){state.selected=+b.dataset.select;state.page='med';render();persist();}
if(b.dataset.check){const x=state.items.find(x=>x.id===+b.dataset.check);if(state.scenario==='error'){say('저장하지 못했어요. 기존 기록은 유지됩니다. ',true);live.insertAdjacentHTML('beforeend',`<button class="hd-btn" data-retrycheck="${x.id}">다시 시도</button>`);icons();return;}x.done=!x.done;render();say(x.done?'복용 완료로 기록했어요.':'복용 체크를 취소했어요.');root.querySelector(`[data-check="${x.id}"]`)?.focus();persist();}
if(b.dataset.scenario){state.scenario=b.dataset.scenario;state.items=state.scenario==='empty'?[]:initial.map(x=>({...x}));state.selected=state.items[0]?.id||0;state.day=0;state.page='med';say('');render();persist();}
if(b.dataset.day){state.day=Math.max(-6,Math.min(0,state.day+Number(b.dataset.day)));render();persist();}if(b.hasAttribute('data-today')){state.day=0;render();persist();}
if(b.hasAttribute('data-connect')){state.connected=!state.connected;render();say(state.connected?'합성 측정 데이터를 연결했어요.':'시뮬레이션 연결을 해제했어요.');persist();}
if(b.hasAttribute('data-next'))advance();if(b.hasAttribute('data-close'))close();if(b.hasAttribute('data-prev')){if(step===2){draft.start=overlay.querySelector('#hd-start').value;draft.end=overlay.querySelector('#hd-end').value;draft.time=overlay.querySelector('#hd-time').value;draft.note=overlay.querySelector('#hd-note').value;draft.notify=overlay.querySelector('#hd-notify').checked;}step--;dialog();}if(b.hasAttribute('data-result')){draft.name='비타민 C · 예시';draft.kind='영양제';dialog();}
if(b.dataset.end){const id=Number(b.dataset.end);open(`<div class="hd-dialoghead"><h2>일정 관리를 종료할까요?</h2><button data-close aria-label="닫기">×</button></div><p class="hd-note">이 앱의 복용 체크와 알림이 중지됩니다.<br>기존 기록은 유지되고, 재시작은 새 등록이 필요합니다.</p><div class="hd-actions"><button class="hd-btn" data-close>계속 관리</button><button class="hd-btn hd-primary" data-confirmend="${id}">관리 종료</button></div>`,'일정 관리 종료 확인');}
if(b.dataset.confirmend){const x=state.items.find(x=>x.id===+b.dataset.confirmend);if(state.scenario==='error'){say('종료 상태를 저장하지 못했어요. 관리 상태를 유지합니다.',true);close();return;}x.ended=true;close();render();say('일정 관리를 종료했어요. 기존 기록은 유지됩니다.');persist();}
});
root.addEventListener('change',e=>{if(e.target.id==='hd-method'){draft.name=overlay.querySelector('#hd-name').value;draft.method=e.target.value;dialog();}});
function advance(){const form=overlay.querySelector('#hd-form');if(!form.reportValidity())return;const err=overlay.querySelector('#hd-formerror');if(step===1){draft.name=overlay.querySelector('#hd-name').value.trim();draft.kind=overlay.querySelector('#hd-kind').value;if(!draft.name){err.textContent='이름을 입력해 주세요.';return;}step=2;dialog();}else if(step===2){draft.start=overlay.querySelector('#hd-start').value;draft.end=overlay.querySelector('#hd-end').value;draft.time=overlay.querySelector('#hd-time').value;draft.note=overlay.querySelector('#hd-note').value;draft.notify=overlay.querySelector('#hd-notify').checked;if(draft.end&&draft.end<draft.start){err.textContent='종료일은 시작일 이후로 선택해 주세요.';return;}step=3;dialog();}else{if(state.scenario==='error'){err.innerHTML='저장에 실패했어요. 입력 내용은 유지됩니다. <button type="button" class="hd-btn" data-retryreg>연결 복구</button>';icons();return;}const id=Math.max(0,...state.items.map(x=>x.id))+1;state.items.push({id,name:draft.name,kind:draft.kind,time:draft.time,start:draft.start,end:draft.end,notify:draft.notify,method:draft.method,note:draft.note,done:false,ended:false});state.items.sort((a,b)=>a.time.localeCompare(b.time));state.selected=id;state.page='med';state.day=0;close();render();say('약과 복용 일정을 등록했어요.');root.querySelector(`[data-select="${id}"]`)?.focus();persist();}}
overlay.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'){e.preventDefault();advance();}if(e.key==='Escape'){e.preventDefault();close();}if(e.key==='Tab'){const a=[...overlay.querySelectorAll('button,input,select')].filter(x=>!x.disabled);if(e.shiftKey&&document.activeElement===a[0]){e.preventDefault();a[a.length-1].focus();}else if(!e.shiftKey&&document.activeElement===a[a.length-1]){e.preventDefault();a[0].focus();}}});
window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState){restore(e.detail.globals.widgetState);render();}});
render();const design={radius:16};if(globalThis.Tweak){const t=new Tweak({container:root,onChange:()=>root.style.setProperty('--hd-radius',design.radius+'px')});t.addSlider(design,'radius',{label:'카드 모서리',min:6,max:22,unit:'px'});}
})();
</script>
